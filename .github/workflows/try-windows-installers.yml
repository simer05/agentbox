# Test-only, on a throwaway branch: runs the app's Windows install buttons'
# command for Claude Code and Codex on a fresh Windows machine, then checks
# the app finds each one. No sign-in, no secrets.
name: try-windows-installers

on:
  push:
    branches: ['test/windows-installers']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-find:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --version
      - run: node .github/try-windows-installers.mts
