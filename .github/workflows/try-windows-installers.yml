# Test-only, on a throwaway branch, on a fresh GitHub Windows machine: opens
# the app past its first screen and screenshots its main pages. A stand-in
# claude.exe, made on the machine, answers the app's "installed?" and
# "signed in?" checks with yes. No real agent, no account, no secrets.
name: try-windows-installers

on:
  push:
    branches: ['test/windows-installers']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-pages-screenshot:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vite build renderer
      - name: Make a stand-in Claude Code that says it is installed and signed in
        shell: powershell
        run: |
          $src = @'
          public static class StandIn {
            public static int Main(string[] args) {
              string all = string.Join(" ", args);
              if (all.Contains("--version")) { System.Console.WriteLine("1.0.0 (stand-in)"); return 0; }
              if (all.StartsWith("auth status")) { System.Console.WriteLine("{\"loggedIn\": true}"); return 0; }
              return 0;
            }
          }
          '@
          New-Item -ItemType Directory -Force "$HOME\.local\bin", "$HOME\.claude" | Out-Null
          Add-Type -TypeDefinition $src -OutputType ConsoleApplication -OutputAssembly "$HOME\.local\bin\claude.exe"
          & "$HOME\.local\bin\claude.exe" auth status --json; "exit $LASTEXITCODE"
      - name: Get a screen recorder
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress | Select-Object -Last 3 }
          ffmpeg -version | Select-Object -First 1
      - name: Open the app and take screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          node -p "require('electron')" | Out-Null
          $exe = (node -p "require('electron')" | Select-Object -Last 1).Trim()
          $app = Start-Process -FilePath $exe -ArgumentList '.' -WorkingDirectory $PWD -PassThru `
            -RedirectStandardOutput shots\app-out.txt -RedirectStandardError shots\app-err.txt
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $shell = New-Object -ComObject WScript.Shell
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          function Key($keys, $name) {
            $null = $shell.AppActivate($app.Id); Start-Sleep -Milliseconds 500
            $shell.SendKeys($keys); Start-Sleep -Seconds 4; Shot $name
          }
          Add-Type -Namespace W -Name Mouse -MemberDefinition @'
          [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
          [DllImport("user32.dll")] public static extern void mouse_event(int f, int x, int y, int d, int e);
          '@
          function Click($x, $y, $name) {
            $null = $shell.AppActivate($app.Id); Start-Sleep -Milliseconds 500
            [W.Mouse]::SetCursorPos($x, $y); Start-Sleep -Milliseconds 200
            [W.Mouse]::mouse_event(2, 0, 0, 0, 0); [W.Mouse]::mouse_event(4, 0, 0, 0, 0)
            Start-Sleep -Seconds 5; Shot $name
          }
          function Hover($x, $y, $name) { [W.Mouse]::SetCursorPos($x, $y); Start-Sleep -Seconds 2; Shot $name }
          function Type($text, $name) {
            $null = $shell.AppActivate($app.Id); Start-Sleep -Milliseconds 300
            foreach ($c in $text.ToCharArray()) { $shell.SendKeys("$c"); Start-Sleep -Milliseconds 60 }
            Start-Sleep -Seconds 2; Shot $name
          }
          Start-Sleep -Seconds 50
          # A screen recording of everything below; fragmented, so stopping it leaves a playable file.
          $rec = Start-Process -FilePath ffmpeg -PassThru -WindowStyle Hidden -ArgumentList '-y -f gdigrab -framerate 8 -i desktop -t 240 -vf scale=1024:-2 -c:v libx264 -preset veryfast -pix_fmt yuv420p -movflags frag_keyframe+empty_moov shots\walk-through-the-app.mp4' `
            -RedirectStandardError shots\ffmpeg-err.txt
          Start-Sleep -Seconds 3; Shot '01-welcome'
          Hover 1000 20 '02-hover-close-light'
          Hover 910 20 '03-hover-minimise-light'
          [W.Mouse]::SetCursorPos(500, 600)
          Key '{ENTER}' '04-get-started'
          Click 295 515 '05-skipped-folder'
          Click 412 568 '06-dark-look'
          Key '{ENTER}' '07-all-set'
          Key '{ENTER}' '08-walkthrough'
          Click 814 26 '09-skipped-walkthrough'
          Start-Sleep -Seconds 3; Shot '10-home'
          Hover 1000 20 '11-hover-close-dark'
          Hover 955 20 '12-hover-maximise-dark'
          # Write a task and send it. The agent is the stand-in, so it does no work.
          Click 500 320 '13-composer'
          Type 'Write a short README for this project' '14-typed'
          Key '^{ENTER}' '15-sent'
          Start-Sleep -Seconds 6; Shot '16-after-send'
          Click 41 205 '17-inbox'
          Click 41 244 '18-connections'
          Click 41 283 '19-files'
          Click 41 668 '20-settings'
          Click 93 218 '21-appearance'
          Key '{ESC}' '22-back'
          Click 41 166 '23-home'
          Click 955 20 '24-maximised'
          Click 955 20 '25-restored'
          Start-Sleep -Seconds 3
          if (-not $rec.HasExited) { Stop-Process -Id $rec.Id -Force }
          "app still running: $(-not $app.HasExited)" | Tee-Object shots\status.txt
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-pages-screenshots
          path: shots
